# =============================================================================
# LLM CONFIG — CBP Transcript Analysis Pipeline
# =============================================================================
# To switch from Anthropic (local dev) to Azure OpenAI (bank production):
# 1. Set client: azure_openai
# 2. Fill in azure_openai section below
# 3. Set AZURE_OPENAI_ENDPOINT, AZURE_OPENAI_KEY, AZURE_OPENAI_DEPLOYMENT
#    in your .env file
# =============================================================================

# Active LLM client: anthropic | azure_openai
client: anthropic

# =============================================================================
# ANTHROPIC CONFIG (local development — Reddy's machine)
# =============================================================================
anthropic:
  model: claude-haiku-4-5             # Fast, cheap for classification tasks
  model_deep: claude-sonnet-4-5       # Used for per-journey doc generation only
  max_tokens: 1024
  temperature: 0.0                    # Deterministic for classification
  # API key read from env: ANTHROPIC_API_KEY

# =============================================================================
# AZURE OPENAI CONFIG (bank production — dev team fills this in)
# =============================================================================
# ⚠️  CONTENT FILTER WARNING FOR BANKS ⚠️
# Azure OpenAI's default content filters WILL trigger on bank transcript content:
# - Fraud descriptions ("my card was stolen", "unauthorized transaction")
# - Financial distress language ("can't pay my loan", "account is frozen")
# - Complaint language (anger, frustration keywords)
# The dev team MUST submit an Azure Content Filter Exception Request before
# running the full pipeline on real transcripts.
# See: https://aka.ms/oai/requestaccess
# Request type: "Modify content filters" → select "Financial services / banking"
# Without this exception, expect 5-15% of requests to fail with ContentFilterError.
azure_openai:
  endpoint: ""                        # TODO: Set to your PTU endpoint URL
                                      # e.g. https://mashreq-cbp.openai.azure.com/
  deployment_name: ""                 # TODO: Set to your deployment name
                                      # e.g. gpt-4o-cbp-ptu
  api_version: "2024-12-01-preview"   # TODO: Confirm latest stable API version
  max_tokens: 1024
  temperature: 0.0
  # API key read from env: AZURE_OPENAI_KEY
  # Endpoint also read from env: AZURE_OPENAI_ENDPOINT (overrides above if set)

# =============================================================================
# COST RATES (per million tokens)
# Update these if pricing changes. Pipeline uses these for pre-run estimates.
# =============================================================================
cost_rates:
  anthropic:
    claude-3-5-haiku-20241022:
      input_per_million: 0.80
      output_per_million: 4.00
    claude-3-5-sonnet-20241022:
      input_per_million: 3.00
      output_per_million: 15.00
  azure_openai:
    gpt-4o:
      input_per_million: 2.50
      output_per_million: 10.00
    gpt-4o-mini:
      input_per_million: 0.15
      output_per_million: 0.60

# =============================================================================
# CLASSIFICATION STAGE CONFIG
# =============================================================================
classification:
  # Stage 1: Journey classification
  journey:
    prompt_file: prompts/journey_classifier_v1.txt
    prompt_version: v1
    model_tier: fast              # fast | deep
    input_messages: 5             # Use first N user messages
    run_on_fraction: 1.0          # Run on 100% of sessions
    avg_tokens_estimate: 500      # Used for cost estimation

  # Stage 2: Transfer reason classification
  transfer_reason:
    prompt_file: prompts/transfer_reason_classifier_v1.txt
    prompt_version: v1
    model_tier: fast
    run_on_fraction: 1.0          # Run on 100% of transferred sessions
    avg_tokens_estimate: 1500

  # Stage 3: Failure mode deep coding
  failure_mode:
    prompt_file: prompts/failure_mode_classifier_v1.txt
    prompt_version: v1
    model_tier: fast
    sample_per_journey_min: 30    # Minimum sessions to deep-code per journey
    sample_per_journey_pct: 0.10  # Or 10% of journey volume, whichever is larger
    avg_tokens_estimate: 3000

  # Stage 4: Remediation type (per-journey, not per-session)
  remediation:
    prompt_file: prompts/remediation_type_classifier_v1.txt
    prompt_version: v1
    model_tier: deep              # Uses the more capable model for synthesis
    avg_tokens_estimate: 2000

  # Per-journey doc generation (Section 11)
  doc_generation:
    model_tier: deep
    avg_tokens_estimate: 8000

# =============================================================================
# BATCH PROCESSING
# =============================================================================
batch:
  max_concurrent_requests: 5     # Parallel LLM calls (adjust for rate limits)
  retry_attempts: 3
  retry_delay_seconds: 2
  timeout_seconds: 30
