# =============================================================================
# TRANSFER (ESCALATION) REASON TAXONOMY
# =============================================================================
transfer_reasons:
  - code: bot_fallback_exhausted
    label: Bot Fallback Exhausted
    description: "NLU could not match intent after multiple retries. Bot gave up and transferred."
    remediation_hint: intent_model_improvement

  - code: customer_demanded_human
    label: Customer Demanded Human
    description: "Customer typed 'agent', 'human', 'operator', or equivalent early in the session."
    remediation_hint: trust_or_ux_failure_or_content_quality

  - code: policy_routed
    label: Policy-Routed Escalation
    description: "Bot correctly identified that this journey requires human intervention per policy."
    remediation_hint: no_action_or_product_or_policy_change

  - code: silent_failure
    label: Silent Failure (Re-contact)
    description: "Session appeared contained, but user re-contacted within 24h on same topic."
    remediation_hint: flow_redesign

  - code: bot_has_data_communicates_poorly
    label: Bot Has Data But Communicates Poorly
    description: "Bot retrieved correct data but response was generic/unhelpful. Reddy's account-closure pattern."
    remediation_hint: content_quality_improvement

  - code: trust_or_ux_failure
    label: Trust or UX Failure
    description: "Bot answered correctly but customer did not trust the answer or found UX confusing."
    remediation_hint: content_quality_improvement

  - code: backend_integration_gap
    label: Backend Integration Gap
    description: "Bot could not complete the action due to missing backend API or system integration."
    remediation_hint: backend_integration

  - code: authentication_friction
    label: Authentication Friction
    description: "Customer could not authenticate to proceed with the bot journey."
    remediation_hint: authentication_friction_reduction

  - code: language_dialect_gap
    label: Language / Dialect Gap
    description: "NLU failed due to dialect variation (Gulf Arabic, Egyptian Arabic, Pakistani Urdu dialect)."
    remediation_hint: language_dialect_coverage


# =============================================================================
# REMEDIATION TYPE TAXONOMY
# =============================================================================
remediation_types:
  - code: faq_addition
    label: FAQ Addition
    description: "Add a new FAQ entry to the bot's knowledge base."
    difficulty: 1  # 1=easy, 5=hard

  - code: content_quality_improvement
    label: Content Quality Improvement
    description: "Improve existing bot response copy — clearer, more specific, more actionable."
    difficulty: 2

  - code: intent_model_improvement
    label: Intent Model Improvement
    description: "Retrain or augment NLU model for this intent."
    difficulty: 3

  - code: flow_redesign
    label: Flow Redesign
    description: "Redesign the conversation flow for this journey."
    difficulty: 3

  - code: authentication_friction_reduction
    label: Authentication Friction Reduction
    description: "Reduce authentication steps or improve fallback for auth failures."
    difficulty: 3

  - code: backend_integration
    label: Backend Integration
    description: "Build or fix a backend API integration required for the bot to complete the action."
    difficulty: 4

  - code: language_dialect_coverage
    label: Language / Dialect Coverage
    description: "Extend NLU training data for underrepresented Arabic or Urdu dialects."
    difficulty: 3

  - code: product_or_policy_change
    label: Product or Policy Change
    description: "The escalation is driven by policy; requires product/ops team to change the rule."
    difficulty: 5

  - code: no_action
    label: No Action Required
    description: "Escalation is appropriate per policy. Bot is working correctly."
    difficulty: 0


# =============================================================================
# EXCLUSION LIST — Journeys excluded from MVP scoring
# =============================================================================
# These journeys are excluded regardless of volume or leakage rate.
# Reasons: regulatory_required_human, high_emotional_stakes, product_advisory_complex
exclusions:
  - journey_id: COMP_003
    reason: high_emotional_stakes
    note: "Fraudulent transaction. Requires empathetic human handling and fraud team escalation."

  - journey_id: COMP_004
    reason: regulatory_required_human
    note: "Security incident. InfoSec policy requires human; cannot be bot-contained."

  - journey_id: WELL_005
    reason: product_advisory_complex
    note: "Product recommendations require suitability assessment under CBUAE guidelines."

  - journey_id: INTL_005
    reason: catch_all
    note: "Unclassified sessions excluded from scoring by definition."

  - journey_id: LOAN_006
    reason: regulatory_required_human
    note: "Loan restructuring requires credit committee review."

  - journey_id: LOAN_007
    reason: regulatory_required_human
    note: "EMI deferral under UAE CBUAE COVID/hardship guidelines; human review required."

  - journey_id: ACCT_008
    reason: regulatory_required_human
    note: "Account freeze may be court-ordered; requires compliance sign-off."

  - journey_id: ACCT_013
    reason: regulatory_required_human
    note: "Joint account additions require full KYC for new party."


# =============================================================================
# SCORING WEIGHTS (Section 10)
# =============================================================================
# All weights must sum to <= 1.0 (penalty is subtracted, so net sum may be < 1)
scoring_weights:
  volume_share: 0.25
  leakage_rate: 0.25
  remediability: 0.20
  cbp_capability_fit: 0.15
  csat_signal: 0.10
  regulatory_complexity_penalty: -0.05  # negative = subtract from score

# Minimum thresholds — journeys below these are excluded from ranking
scoring_thresholds:
  minimum_volume_sessions: 500  # over the 6-month analysis window
  minimum_leakage_rate: 0.05    # exclude journeys with < 5% escalation rate (not worth fixing)

# How many top journeys to include in MVP shortlist
mvp_shortlist_size: 10
mvp_runners_up: 5


# =============================================================================
# CSAT JOIN CONFIG (Section 9B)
# =============================================================================
csat_join:
  window_minutes: 60           # Max time between session end and CSAT submission
  prefer_direct_join: true     # Use session_id direct join when available


# =============================================================================
# PARETO DISTRIBUTION FOR SYNTHETIC DATA (Section 5)
# =============================================================================
# The top N journeys carry this share of total traffic
pareto:
  top_n_journeys: 15
  traffic_share: 0.60          # top 15 carry 60% of sessions

# Geography distribution
geography:
  UAE: 0.60
  Egypt: 0.25
  Pakistan: 0.15

# Language distribution per geography
language_by_geography:
  UAE:
    en: 0.75
    ar: 0.20
    ur: 0.05
  Egypt:
    ar: 0.70
    en: 0.30
  Pakistan:
    ur: 0.60
    en: 0.40

# Failure mode distribution (across all sessions with escalation)
failure_mode_distribution:
  bot_fallback_exhausted: 0.20
  customer_demanded_human: 0.15
  policy_routed: 0.10
  silent_failure: 0.10
  bot_has_data_communicates_poorly: 0.15
  trust_or_ux_failure: 0.10
  backend_integration_gap: 0.10
  authentication_friction: 0.05
  language_dialect_gap: 0.05

# CSAT generation
csat:
  response_rate: 0.12          # 12% of sessions receive a CSAT response
  comment_rate: 0.30           # 30% of CSAT responses have a non-empty comment
  pii_in_comment_rate: 0.05   # 5% of comments contain PII
