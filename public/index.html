<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mashreq CBP Transcript Analysis</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --brand: #1a73e8;
    --brand-dark: #1557b0;
    --green: #34a853;
    --amber: #fbbc04;
    --red: #ea4335;
    --bg: #f8f9fa;
    --surface: #fff;
    --border: #e0e0e0;
    --text: #1a1a1a;
    --muted: #5f6368;
    --sidebar-w: 220px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

  /* Sidebar */
  #sidebar {
    width: var(--sidebar-w); background: #1c2b4b; color: #fff;
    display: flex; flex-direction: column; flex-shrink: 0; position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  #sidebar .brand { padding: 20px 16px 12px; border-bottom: 1px solid rgba(255,255,255,.1); }
  #sidebar .brand h1 { font-size: 14px; font-weight: 700; line-height: 1.3; }
  #sidebar .brand small { font-size: 11px; opacity: .65; }
  #sidebar nav { flex: 1; padding: 8px 0; }
  #sidebar nav button {
    display: block; width: 100%; text-align: left; padding: 10px 16px;
    background: none; border: none; color: rgba(255,255,255,.8); cursor: pointer;
    font-size: 13px; transition: background .15s;
  }
  #sidebar nav button:hover { background: rgba(255,255,255,.08); }
  #sidebar nav button.active { background: rgba(255,255,255,.15); color: #fff; font-weight: 600; border-left: 3px solid var(--brand); }
  #sidebar .sidebar-footer { padding: 12px 16px; border-top: 1px solid rgba(255,255,255,.1); font-size: 11px; opacity: .55; line-height: 1.6; }

  /* Banner */
  #banner { background: #ea4335; color: #fff; text-align: center; padding: 7px; font-size: 12px; font-weight: 600; letter-spacing: .3px; }

  /* Main */
  #main { flex: 1; display: flex; flex-direction: column; overflow-x: hidden; }
  #content { flex: 1; padding: 24px 28px; max-width: 1200px; }
  #content h2 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  #content .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

  /* Metrics row */
  .metric-row { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .metric-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px 20px; flex: 1 1 160px; }
  .metric-card .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
  .metric-card .value { font-size: 26px; font-weight: 700; }
  .metric-card .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* Journey cards */
  .journey-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 16px; margin-bottom: 10px; border-left: 4px solid var(--brand);
    display: flex; align-items: flex-start; gap: 12px;
  }
  .journey-card.green { border-left-color: var(--green); }
  .journey-card.amber { border-left-color: var(--amber); }
  .journey-card.red-card { border-left-color: var(--red); }
  .journey-card .rank { font-size: 20px; font-weight: 800; color: var(--muted); width: 36px; flex-shrink: 0; padding-top: 2px; }
  .journey-card .body { flex: 1; }
  .journey-card .name { font-size: 15px; font-weight: 600; }
  .journey-card .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .journey-card .why { font-size: 12px; margin-top: 6px; color: #444; }
  .journey-card .badges { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }

  /* Badges */
  .badge {
    display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 12px;
    font-weight: 600; background: #f1f3f4; color: var(--text);
  }
  .badge.green { background: #e6f4ea; color: #1e7e34; }
  .badge.amber { background: #fff3cd; color: #856404; }
  .badge.red { background: #fce8e6; color: #c62828; }
  .badge.blue { background: #e8f0fe; color: #1557b0; }

  /* Section divider */
  .section-divider { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

  /* Chart container */
  .chart-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
  .chart-wrap h3 { font-size: 15px; font-weight: 600; margin-bottom: 16px; }
  .chart-wrap canvas { max-height: 320px; }

  /* Table */
  .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .data-table th { background: #f1f3f4; padding: 8px 12px; text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); }
  .data-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .data-table tr:last-child td { border-bottom: none; }
  .data-table tr:hover td { background: #fafafa; }
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 20px; }

  /* Two columns */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  @media(max-width: 700px) { .two-col { grid-template-columns: 1fr; } }

  /* Expander */
  details { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; }
  summary { padding: 12px 16px; cursor: pointer; font-size: 13px; font-weight: 500; list-style: none; display: flex; align-items: center; gap: 8px; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: '▶'; font-size: 10px; transition: transform .2s; color: var(--muted); }
  details[open] summary::before { transform: rotate(90deg); }
  .details-body { padding: 0 16px 16px; }

  /* Slider controls */
  .slider-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
  @media(max-width: 700px) { .slider-grid { grid-template-columns: 1fr; } }
  .slider-item label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: var(--muted); }
  .slider-item input[type=range] { width: 100%; accent-color: var(--brand); }
  .slider-item .val { font-size: 13px; font-weight: 700; color: var(--brand); }

  /* Ranking comparison */
  .rank-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  .rank-col { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .rank-col h3 { font-size: 13px; font-weight: 700; margin-bottom: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .rank-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; border-bottom: 1px solid var(--border); }
  .rank-row:last-child { border-bottom: none; }
  .rank-row .rnum { font-weight: 700; width: 28px; color: var(--muted); }
  .rank-row .rname { flex: 1; }
  .rank-row .rscore { font-weight: 600; font-size: 12px; color: var(--brand); }
  .rank-row .rdelta { font-size: 11px; font-weight: 700; width: 28px; text-align: right; }
  .rdelta.up { color: var(--green); }
  .rdelta.down { color: var(--red); }

  /* Loading */
  #loading { display: flex; align-items: center; justify-content: center; height: 200px; color: var(--muted); font-size: 15px; }
  .spinner { width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; margin-right: 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Select, filter controls */
  select, input[type=text] { border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; font-size: 13px; background: var(--surface); color: var(--text); }
  select:focus, input[type=text]:focus { outline: 2px solid var(--brand); }
  .control-row { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .control-row label { font-size: 12px; font-weight: 600; color: var(--muted); }
  .sort-btn { padding: 6px 14px; border: 1px solid var(--border); border-radius: 20px; background: var(--surface); font-size: 12px; cursor: pointer; transition: all .15s; }
  .sort-btn.active { background: var(--brand); color: #fff; border-color: var(--brand); }
</style>
</head>
<body>

<!-- Sidebar -->
<nav id="sidebar">
  <div class="brand">
    <h1>🏦 Mashreq CBP Analysis</h1>
    <small>MVP Journey Prioritization</small>
  </div>
  <nav id="nav-buttons">
    <button onclick="navigate('top-journeys')" class="active" data-view="top-journeys">1. Top Priority Journeys</button>
    <button onclick="navigate('per-journey')" data-view="per-journey">2. Per-Journey Deep Dive</button>
    <button onclick="navigate('labor')" data-view="labor">3. Bot vs Agent Labor</button>
    <button onclick="navigate('knowledge')" data-view="knowledge">4. Knowledge Transfer</button>
    <button onclick="navigate('what-if')" data-view="what-if">5. What-If Scoring</button>
  </nav>
  <div class="sidebar-footer">
    10,000 synthetic sessions<br>Nov 2025 – Apr 2026<br>⚠ Synthetic data
  </div>
</nav>

<!-- Main -->
<div id="main">
  <div id="banner">⚠️ SYNTHETIC DATA — NOT REAL CUSTOMER DATA</div>
  <div id="content">
    <div id="loading"><div class="spinner"></div> Loading data…</div>
  </div>
</div>

<script>
// ────────────────────────────────────────────────
// Data loading
// ────────────────────────────────────────────────
const DATA = {};
const FILES = ['mvp_shortlist','leakage_map','division_of_labor','knowledge_transfer','temporal_trends','scored_journeys','pipeline_summary'];
let chartInstances = {};

async function loadAll() {
  await Promise.all(FILES.map(async f => {
    try {
      const r = await fetch(`/data/${f}.json`);
      if (r.ok) DATA[f] = await r.json();
    } catch(e) { console.warn('Could not load', f, e); }
  }));
  document.getElementById('loading').style.display = 'none';
  navigate('top-journeys');
}

function destroyCharts() {
  Object.values(chartInstances).forEach(c => { try { c.destroy(); } catch(e){} });
  chartInstances = {};
}

// ────────────────────────────────────────────────
// Navigation
// ────────────────────────────────────────────────
function navigate(view) {
  destroyCharts();
  document.querySelectorAll('#nav-buttons button').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  const el = document.getElementById('content');
  el.innerHTML = '';
  ({
    'top-journeys': renderTopJourneys,
    'per-journey': renderPerJourney,
    'labor': renderLabor,
    'knowledge': renderKnowledge,
    'what-if': renderWhatIf,
  })[view]?.();
}

// ────────────────────────────────────────────────
// Helpers
// ────────────────────────────────────────────────
function pct(v) { return (v*100).toFixed(1)+'%'; }
function fmt(v) { return Number(v).toLocaleString(); }

function confidenceBadge(tier) {
  const cls = { HIGH: 'green', MEDIUM: 'amber', LOW: 'red' }[tier] || '';
  return `<span class="badge ${cls}">${tier}</span>`;
}

function remediationColor(code) {
  const easy = new Set(['faq_addition','content_quality_improvement']);
  const hard = new Set(['backend_integration','product_or_policy_change']);
  if (easy.has(code)) return 'green';
  if (hard.has(code)) return 'red';
  return 'amber';
}

function cardClass(cbpFit) {
  if (cbpFit >= 0.8) return 'green';
  if (cbpFit >= 0.5) return 'amber';
  return 'red-card';
}

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})) el.setAttribute(k, v);
  children.forEach(c => { if (c == null) return; el.append(typeof c === 'string' ? document.createTextNode(c) : c); });
  return el;
}

function html(strings, ...vals) {
  const s = strings.reduce((acc, str, i) => acc + str + (vals[i] ?? ''), '');
  const d = document.createElement('div');
  d.innerHTML = s;
  return d.firstElementChild || d;
}

function div(cls, inner='') {
  const el = document.createElement('div');
  el.className = cls;
  if (typeof inner === 'string') el.innerHTML = inner;
  else el.appendChild(inner);
  return el;
}

// ────────────────────────────────────────────────
// View 1: Top Priority Journeys
// ────────────────────────────────────────────────
function renderTopJourneys() {
  const content = document.getElementById('content');
  const mvp = DATA['mvp_shortlist'] || {};
  const shortlist = mvp.mvp_shortlist || [];
  const runners = mvp.runners_up || [];
  const excluded = mvp.excluded_journeys || [];
  const leakage = DATA['leakage_map'] || {};
  const summary = leakage.summary || {};

  const header = document.createElement('div');
  header.innerHTML = `<h2>Top Priority Journeys</h2><p class="subtitle">Ranked by composite score. MVP candidates for bot automation.</p>`;
  content.appendChild(header);

  // Metrics
  const metrics = div('metric-row');
  metrics.innerHTML = `
    <div class="metric-card"><div class="label">Total Sessions</div><div class="value">${fmt(summary.total_sessions||0)}</div></div>
    <div class="metric-card"><div class="label">Total Escalations</div><div class="value">${fmt(summary.total_escalated||0)}</div></div>
    <div class="metric-card"><div class="label">Escalation Rate</div><div class="value">${pct(summary.overall_escalation_rate||0)}</div></div>
    <div class="metric-card"><div class="label">MVP Candidates</div><div class="value">${shortlist.length}</div></div>
  `;
  content.appendChild(metrics);

  // Sort controls
  let sortBy = 'composite_score';
  const sortKeys = { 'Composite Score': 'composite_score', 'Total Volume': 'total_sessions', 'Leakage Rate': 'escalation_rate' };
  const controlRow = div('control-row');
  const sortLabel = document.createElement('label');
  sortLabel.textContent = 'Sort by:';
  controlRow.appendChild(sortLabel);

  const btns = {};
  Object.keys(sortKeys).forEach(label => {
    const btn = document.createElement('button');
    btn.className = 'sort-btn' + (label === 'Composite Score' ? ' active' : '');
    btn.textContent = label;
    btn.onclick = () => {
      sortBy = sortKeys[label];
      Object.values(btns).forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderList();
    };
    btns[label] = btn;
    controlRow.appendChild(btn);
  });
  content.appendChild(controlRow);

  const listContainer = div('');
  content.appendChild(listContainer);

  function renderList() {
    listContainer.innerHTML = '';
    const all = [...shortlist, ...runners].sort((a,b) => b[sortBy] - a[sortBy]);

    const sectionLabel = div('');
    sectionLabel.innerHTML = `<h3 style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:12px;">🏆 MVP Shortlist + Runners-Up (${all.length})</h3>`;
    listContainer.appendChild(sectionLabel);

    all.forEach((row, idx) => {
      const rank = row.mvp_rank ?? idx + 1;
      const card = div(`journey-card ${cardClass(row.cbp_capability_fit)}`);
      const remCls = remediationColor(row.primary_remediation);
      card.innerHTML = `
        <div class="rank">#${rank}</div>
        <div class="body">
          <div class="name">${row.journey_name || row.journey_id}</div>
          <div class="meta">${row.journey_id} · ${fmt(row.escalated_sessions)} escalations · ${pct(row.escalation_rate)} rate</div>
          <div class="why">${row.why_this_matters || ''}</div>
          <div class="badges">
            ${confidenceBadge(row.confidence)}
            <span class="badge ${remCls}">${row.primary_remediation}</span>
            <span class="badge blue">Score: ${(row.composite_score||0).toFixed(3)}</span>
            <span class="badge">CBP Fit: ${pct(row.cbp_capability_fit)}</span>
          </div>
        </div>
      `;
      card.style.cursor = 'pointer';
      card.addEventListener('click', () => {
        window._drillJourney = row.journey_id;
        navigate('per-journey');
      });
      listContainer.appendChild(card);
    });

    if (excluded.length) {
      const excl = document.createElement('details');
      excl.innerHTML = `<summary>🚫 Excluded Journeys (${excluded.length})</summary>`;
      const body = div('details-body');
      excluded.forEach(row => {
        body.innerHTML += `<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;">
          <b>${row.journey_name || row.journey_id}</b> <span class="badge red">${row.exclusion_reason}</span>
          <span style="color:var(--muted);margin-left:8px;">${fmt(row.total_sessions)} sessions</span>
        </div>`;
      });
      excl.appendChild(body);
      listContainer.appendChild(excl);
    }
  }

  renderList();
}

// ────────────────────────────────────────────────
// View 2: Per-Journey Deep Dive
// ────────────────────────────────────────────────
function renderPerJourney() {
  const content = document.getElementById('content');
  const mvp = DATA['mvp_shortlist'] || {};
  const all = [...(mvp.mvp_shortlist||[]), ...(mvp.runners_up||[])];

  if (!all.length) {
    content.innerHTML = '<h2>Per-Journey Deep Dive</h2><p style="color:var(--muted);margin-top:16px;">No journey data available.</p>';
    return;
  }

  const header = document.createElement('div');
  header.innerHTML = `<h2>Per-Journey Deep Dive</h2><p class="subtitle">Select a journey to explore its metrics and trends.</p>`;
  content.appendChild(header);

  // Journey selector
  const selectRow = div('control-row');
  const selectLabel = document.createElement('label');
  selectLabel.textContent = 'Journey:';
  const select = document.createElement('select');
  all.forEach(j => {
    const opt = document.createElement('option');
    opt.value = j.journey_id;
    opt.textContent = `${j.journey_id} — ${j.journey_name}`;
    if (j.journey_id === window._drillJourney) opt.selected = true;
    select.appendChild(opt);
  });
  selectRow.append(selectLabel, select);
  content.appendChild(selectRow);

  const detailContainer = div('');
  content.appendChild(detailContainer);

  function renderDetail() {
    detailContainer.innerHTML = '';
    const jid = select.value;
    const j = all.find(x => x.journey_id === jid) || {};
    const leakage = DATA['leakage_map'] || {};
    const jLeakage = (leakage.journeys||[]).find(x => x.journey_id === jid) || {};
    const trends = DATA['temporal_trends'] || {};
    const jTrend = (trends.journeys||[]).find(x => x.journey_id === jid) || {};

    // Header metrics
    const mRow = div('metric-row');
    mRow.innerHTML = `
      <div class="metric-card"><div class="label">MVP Rank</div><div class="value">#${j.mvp_rank||'N/A'}</div></div>
      <div class="metric-card"><div class="label">Total Sessions</div><div class="value">${fmt(j.total_sessions||0)}</div></div>
      <div class="metric-card"><div class="label">Escalations</div><div class="value">${fmt(j.escalated_sessions||0)}</div></div>
      <div class="metric-card"><div class="label">Escalation Rate</div><div class="value">${pct(j.escalation_rate||0)}</div></div>
      <div class="metric-card"><div class="label">Avg CSAT</div><div class="value">${(j.avg_csat||0).toFixed(1)}/5.0</div></div>
    `;
    detailContainer.appendChild(mRow);

    // Badges
    const bRow = div('');
    bRow.style.marginBottom = '20px';
    bRow.innerHTML = `${confidenceBadge(j.confidence)} <span class="badge ${remediationColor(j.primary_remediation)}">${j.primary_remediation}</span> <span class="badge blue">Score: ${(j.composite_score||0).toFixed(3)}</span>`;
    detailContainer.appendChild(bRow);

    // Why this matters
    const why = div('chart-wrap');
    why.innerHTML = `<h3>Why This Matters</h3><p style="font-size:13px;color:var(--muted);">${j.why_this_matters||'No summary available.'}</p>`;
    detailContainer.appendChild(why);

    // Two-col charts
    const twoCol = div('two-col');

    // Transfer reason breakdown
    const leftChart = div('chart-wrap');
    leftChart.innerHTML = '<h3>Failure Mode Breakdown</h3>';
    const trBreak = jLeakage.transfer_reason_breakdown || {};
    const trKeys = Object.keys(trBreak);
    if (trKeys.length) {
      const canvas = document.createElement('canvas');
      leftChart.appendChild(canvas);
      chartInstances['tr'] = new Chart(canvas, {
        type: 'bar',
        data: {
          labels: trKeys,
          datasets: [{ data: trKeys.map(k=>trBreak[k]), backgroundColor: '#1a73e8', borderRadius: 4 }]
        },
        options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } }, responsive: true }
      });
    } else {
      leftChart.innerHTML += '<p style="color:var(--muted);font-size:13px;">No transfer reason data available.</p>';
    }
    twoCol.appendChild(leftChart);

    // Weekly trend
    const rightChart = div('chart-wrap');
    rightChart.innerHTML = '<h3>Weekly Leakage Trend</h3>';
    const ts = jTrend.timeseries || [];
    if (ts.length) {
      const canvas2 = document.createElement('canvas');
      rightChart.appendChild(canvas2);
      chartInstances['trend'] = new Chart(canvas2, {
        type: 'line',
        data: {
          labels: ts.map(t=>t.week),
          datasets: [{ label: 'Escalation Rate %', data: ts.map(t=>t.rate_pct||t.escalation_rate*100||0), borderColor: '#ea4335', backgroundColor: 'rgba(234,67,53,.1)', tension: .3, fill: true }]
        },
        options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } }, responsive: true }
      });
    } else {
      rightChart.innerHTML += '<p style="color:var(--muted);font-size:13px;">No temporal data available.</p>';
    }
    twoCol.appendChild(rightChart);
    detailContainer.appendChild(twoCol);
  }

  select.addEventListener('change', renderDetail);
  renderDetail();
}

// ────────────────────────────────────────────────
// View 3: Bot vs Agent Division of Labor
// ────────────────────────────────────────────────
function renderLabor() {
  const content = document.getElementById('content');
  const labor = DATA['division_of_labor'] || {};
  const journeys = labor.journeys || [];
  const summary = labor.summary || {};

  const header = document.createElement('div');
  header.innerHTML = `<h2>Bot vs. Agent Division of Labor</h2><p class="subtitle">Per-journey breakdown of bot containment, correct escalations, and incorrect escalations.</p>`;
  content.appendChild(header);

  // Metrics
  const metrics = div('metric-row');
  metrics.innerHTML = `
    <div class="metric-card"><div class="label">Bot Correctly Contained</div><div class="value">${fmt(summary.total_correctly_contained||0)}</div></div>
    <div class="metric-card"><div class="label">Bot Correctly Escalated</div><div class="value">${fmt(summary.total_correctly_escalated||0)}</div></div>
    <div class="metric-card"><div class="label">Bot Incorrectly Escalated</div><div class="value" style="color:var(--red)">${fmt(summary.total_incorrectly_escalated||0)}</div></div>
    <div class="metric-card"><div class="label">Agent Slow</div><div class="value">${fmt(summary.total_agent_slow||0)}</div></div>
  `;
  content.appendChild(metrics);

  // Sort control
  let sortCol = 'bot_incorrectly_escalated';
  const sortOpts = { 'Incorrectly Escalated': 'bot_incorrectly_escalated', 'Correctly Contained': 'bot_correctly_contained', 'Total Sessions': 'total_sessions' };
  const controlRow = div('control-row');
  const lbl = document.createElement('label');
  lbl.textContent = 'Sort by:';
  controlRow.appendChild(lbl);
  const btns = {};
  Object.keys(sortOpts).forEach(label => {
    const btn = document.createElement('button');
    btn.className = 'sort-btn' + (label === 'Incorrectly Escalated' ? ' active' : '');
    btn.textContent = label;
    btn.onclick = () => {
      sortCol = sortOpts[label];
      Object.values(btns).forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderChart();
    };
    btns[label] = btn;
    controlRow.appendChild(btn);
  });
  content.appendChild(controlRow);

  const chartWrap = div('chart-wrap');
  chartWrap.innerHTML = '<h3>Journey Breakdown (Top 20)</h3>';
  const canvas = document.createElement('canvas');
  chartWrap.appendChild(canvas);
  content.appendChild(chartWrap);

  function renderChart() {
    if (chartInstances['labor']) { chartInstances['labor'].destroy(); delete chartInstances['labor']; }
    const sorted = [...journeys].sort((a,b) => b[sortCol] - a[sortCol]).slice(0,20).filter(j => j.total_sessions > 1);
    chartInstances['labor'] = new Chart(canvas, {
      type: 'bar',
      data: {
        labels: sorted.map(j => j.journey_id),
        datasets: [
          { label: 'Bot Contained ✓', data: sorted.map(j=>j.bot_correctly_contained), backgroundColor: '#34a853' },
          { label: 'Bot Escalated ✓', data: sorted.map(j=>j.bot_correctly_escalated), backgroundColor: '#1a73e8' },
          { label: 'Bot Escalated ✗', data: sorted.map(j=>j.bot_incorrectly_escalated), backgroundColor: '#ea4335' },
        ]
      },
      options: {
        responsive: true,
        plugins: { legend: { position: 'top' } },
        scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } }
      }
    });
  }
  renderChart();

  // Table
  const tableWrap = div('table-wrap');
  const sortedAll = [...journeys].sort((a,b) => b.bot_incorrectly_escalated - a.bot_incorrectly_escalated);
  tableWrap.innerHTML = `
    <table class="data-table">
      <thead><tr><th>Journey</th><th>Sessions</th><th>Bot ✓ Contained</th><th>Bot ✓ Escalated</th><th>Bot ✗ Escalated</th><th>Escalation Rate</th></tr></thead>
      <tbody>
        ${sortedAll.map(j=>`<tr>
          <td><b>${j.journey_id}</b><br><span style="color:var(--muted);font-size:11px">${j.journey_name||''}</span></td>
          <td>${fmt(j.total_sessions)}</td>
          <td style="color:var(--green)">${fmt(j.bot_correctly_contained)}</td>
          <td style="color:var(--brand)">${fmt(j.bot_correctly_escalated)}</td>
          <td style="color:${j.bot_incorrectly_escalated>0?'var(--red)':'inherit'}">${fmt(j.bot_incorrectly_escalated)}</td>
          <td>${pct(j.escalation_rate)}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  `;
  content.appendChild(tableWrap);
}

// ────────────────────────────────────────────────
// View 4: Knowledge Transfer
// ────────────────────────────────────────────────
function renderKnowledge() {
  const content = document.getElementById('content');
  const kt = DATA['knowledge_transfer'] || {};
  const opps = kt.opportunities || [];
  const ktSummary = kt.summary || {};

  const header = document.createElement('div');
  header.innerHTML = `<h2>Agent Knowledge Transfer Opportunities</h2><p class="subtitle">Recurring agent explanations that could be automated by the bot, sorted by automation impact.</p>`;
  content.appendChild(header);

  // Metrics
  const metrics = div('metric-row');
  const botFeasible = opps.filter(o=>o.bot_feasibility==='yes').length;
  const withData = opps.filter(o=>o.bot_feasibility==='with_data_access').length;
  metrics.innerHTML = `
    <div class="metric-card"><div class="label">Total Opportunities</div><div class="value">${ktSummary.total_opportunities||opps.length}</div></div>
    <div class="metric-card"><div class="label">Bot-Feasible (No Integration)</div><div class="value" style="color:var(--green)">${botFeasible}</div></div>
    <div class="metric-card"><div class="label">Feasible with Data Access</div><div class="value" style="color:var(--amber)">${withData}</div></div>
  `;
  content.appendChild(metrics);

  // Filters
  let minFreq = 3;
  let feasFilter = new Set(['yes','with_data_access','no']);

  const filterRow = div('control-row');
  filterRow.innerHTML = `<label>Min Frequency:</label>`;
  const freqInput = document.createElement('input');
  freqInput.type = 'range'; freqInput.min = 1; freqInput.max = 100; freqInput.value = 3; freqInput.style.width = '120px';
  const freqVal = document.createElement('span');
  freqVal.className = 'val'; freqVal.textContent = '3';
  freqInput.addEventListener('input', () => { minFreq = +freqInput.value; freqVal.textContent = freqInput.value; renderList(); });
  filterRow.append(freqInput, freqVal);
  content.appendChild(filterRow);

  const listContainer = div('');
  content.appendChild(listContainer);

  function renderList() {
    listContainer.innerHTML = '';
    const filtered = opps.filter(o => o.frequency >= minFreq).sort((a,b) => b.automation_impact_score - a.automation_impact_score);
    const caption = div('');
    caption.innerHTML = `<p style="font-size:12px;color:var(--muted);margin-bottom:12px;">Showing ${filtered.length} opportunities (filtered from ${opps.length} total)</p>`;
    listContainer.appendChild(caption);

    filtered.slice(0,30).forEach((opp, i) => {
      const feasIcon = {yes:'🟢', with_data_access:'🟡', no:'🔴'}[opp.bot_feasibility]||'⚪';
      const el = document.createElement('details');
      if (i === 0) el.open = true;
      el.innerHTML = `<summary>${feasIcon} ${(opp.representative_message||'').substring(0,80)}… | Freq: ${opp.frequency} | Impact: ${(opp.automation_impact_score||0).toFixed(1)}</summary>`;
      const body = div('details-body');
      body.innerHTML = `
        <p><b>Journey:</b> ${opp.journey_name||opp.journey_id}</p>
        <p style="margin-top:6px"><b>Frequency:</b> Appeared ${opp.frequency} times</p>
        <p style="margin-top:4px"><b>Bot Feasibility:</b> ${feasIcon} ${opp.bot_feasibility}</p>
        <p style="margin-top:4px"><b>Automation Impact Score:</b> ${(opp.automation_impact_score||0).toFixed(1)}</p>
        <p style="margin-top:10px;margin-bottom:4px"><b>Representative Agent Message:</b></p>
        <pre style="background:#f8f9fa;padding:10px;border-radius:6px;font-size:12px;white-space:pre-wrap;border:1px solid var(--border)">${opp.representative_message||''}</pre>
        ${(opp.example_messages||[]).slice(1,3).map(ex=>`<p style="margin-top:6px;font-size:12px;color:var(--muted)">• ${ex.substring(0,150)}</p>`).join('')}
      `;
      el.appendChild(body);
      listContainer.appendChild(el);
    });

    if (!filtered.length) listContainer.innerHTML = '<p style="color:var(--muted);">No opportunities match the current filter.</p>';
  }

  renderList();
}

// ────────────────────────────────────────────────
// View 5: What-If Scoring
// ────────────────────────────────────────────────
function renderWhatIf() {
  const content = document.getElementById('content');
  const scored = DATA['scored_journeys'] || {};
  const journeys = scored.scored_journeys || [];

  const header = document.createElement('div');
  header.innerHTML = `<h2>What-If Scoring</h2><p class="subtitle">Adjust scoring weights to see how the MVP ranking changes in real time.</p>`;
  content.appendChild(header);

  // Weight sliders
  const weights = {
    volume_share: { label: 'Volume Share', val: 0.25, min: 0, max: 0.5, step: 0.05 },
    leakage_rate: { label: 'Leakage Rate', val: 0.25, min: 0, max: 0.5, step: 0.05 },
    remediability: { label: 'Remediability', val: 0.20, min: 0, max: 0.5, step: 0.05 },
    cbp_capability_fit: { label: 'CBP Capability Fit', val: 0.15, min: 0, max: 0.5, step: 0.05 },
    csat_signal: { label: 'CSAT Signal', val: 0.10, min: 0, max: 0.3, step: 0.05 },
    regulatory_complexity_penalty: { label: 'Regulatory Penalty', val: -0.05, min: -0.2, max: 0, step: 0.01 },
  };

  const sliderGrid = div('slider-grid');
  const sliderEls = {};
  Object.entries(weights).forEach(([key, w]) => {
    const item = div('slider-item');
    const valSpan = document.createElement('span');
    valSpan.className = 'val';
    valSpan.textContent = w.val.toFixed(2);
    item.innerHTML = `<label>${w.label}</label>`;
    const input = document.createElement('input');
    input.type = 'range'; input.min = w.min; input.max = w.max; input.step = w.step; input.value = w.val;
    input.addEventListener('input', () => {
      w.val = parseFloat(input.value);
      valSpan.textContent = w.val.toFixed(2);
      renderRanking();
    });
    sliderEls[key] = input;
    item.append(input, valSpan);
    sliderGrid.appendChild(item);
  });

  const sliderSection = div('chart-wrap');
  sliderSection.innerHTML = '<h3>Scoring Weights</h3>';
  sliderSection.appendChild(sliderGrid);
  content.appendChild(sliderSection);

  // Ranking comparison
  const rankWrap = div('rank-compare');
  const defaultCol = div('rank-col');
  defaultCol.innerHTML = '<h3>Default Weights</h3>';
  const customCol = div('rank-col');
  customCol.innerHTML = '<h3>Your Weights</h3>';
  rankWrap.append(defaultCol, customCol);
  content.appendChild(rankWrap);

  function recompute(j, w) {
    return (w.volume_share.val * (j.volume_share||0) * 10)
         + (w.leakage_rate.val * (j.escalation_rate||0))
         + (w.remediability.val * (j.remediability||0))
         + (w.cbp_capability_fit.val * (j.cbp_capability_fit||0))
         + (w.csat_signal.val * (j.csat_signal||0))
         + (w.regulatory_complexity_penalty.val * (j.regulatory_complexity||0));
  }

  function renderRanking() {
    const eligible = journeys.filter(j => !j.excluded && !j.below_threshold);
    const defaultRanked = [...eligible].sort((a,b) => b.composite_score - a.composite_score);
    const defaultOrder = Object.fromEntries(defaultRanked.map((j,i)=>[j.journey_id, i+1]));

    eligible.forEach(j => { j._custom = recompute(j, weights); });
    const customRanked = [...eligible].sort((a,b) => b._custom - a._custom);

    defaultCol.innerHTML = '<h3>Default Weights</h3>';
    defaultRanked.slice(0,10).forEach((j, i) => {
      const row = div('rank-row');
      row.innerHTML = `<span class="rnum">#${i+1}</span><span class="rname">${j.journey_name?.substring(0,28)||j.journey_id}</span><span class="rscore">${(j.composite_score||0).toFixed(3)}</span>`;
      defaultCol.appendChild(row);
    });

    customCol.innerHTML = '<h3>Your Weights</h3>';
    customRanked.slice(0,10).forEach((j, i) => {
      const defRank = defaultOrder[j.journey_id] || 99;
      const delta = defRank - (i+1);
      const row = div('rank-row');
      const deltaHtml = delta !== 0 ? `<span class="rdelta ${delta>0?'up':'down'}">${delta>0?'↑':'↓'}${Math.abs(delta)}</span>` : `<span class="rdelta">−</span>`;
      row.innerHTML = `<span class="rnum">#${i+1}</span><span class="rname">${j.journey_name?.substring(0,28)||j.journey_id}</span><span class="rscore">${(j._custom||0).toFixed(3)}</span>${deltaHtml}`;
      customCol.appendChild(row);
    });
  }

  renderRanking();
}

// ────────────────────────────────────────────────
// Boot
// ────────────────────────────────────────────────
loadAll();
</script>
